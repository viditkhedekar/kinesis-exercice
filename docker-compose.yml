services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kinesis
      POSTGRES_PASSWORD: kinesis
      POSTGRES_DB: kinesis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinesis"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KINESIS_DATABASE_URL: postgresql+psycopg2://kinesis:kinesis@postgres:5432/kinesis
      # Storage. With no SUPABASE_* values set, "auto" resolves to the local
      # filesystem below, so compose works with no Supabase account. Export
      # SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY to exercise the production
      # backend locally — they are read from your shell, never committed.
      KINESIS_STORAGE_BACKEND: ${KINESIS_STORAGE_BACKEND:-auto}
      KINESIS_STORAGE_DIR: /data/kinesis
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-kinesis-media}
      # Email verification. Locally defaults to "console" (link is logged, not sent).
      # For production set EMAIL_PROVIDER=resend + RESEND_API_KEY (or sendgrid / smtp).
      KINESIS_REQUIRE_EMAIL_VERIFICATION: ${KINESIS_REQUIRE_EMAIL_VERIFICATION:-true}
      KINESIS_FRONTEND_URL: ${KINESIS_FRONTEND_URL:-http://localhost:3000}
      KINESIS_EMAIL_PROVIDER: ${KINESIS_EMAIL_PROVIDER:-console}
      KINESIS_EMAIL_FROM: ${KINESIS_EMAIL_FROM:-physIQal <onboarding@resend.dev>}
      KINESIS_RESEND_API_KEY: ${RESEND_API_KEY:-}
      KINESIS_SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      # Local-only durable storage for the filesystem backend. Production (Render)
      # has no such disk — everything durable lives in Supabase Storage.
      - mediadata:/data/kinesis

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      # Browser-side calls hit the backend on localhost:8000 (published port).
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  pgdata:
  mediadata:
